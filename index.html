
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    color: #1a1a1a;
    padding: 40px 32px;
    max-width: 700px;
  }

  /* TOP SECTION */
  .top {
    display: flex;
    align-items: flex-start;
    gap: 32px;
    margin-bottom: 36px;
  }

  /* Ring */
  .ring-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    flex-shrink: 0;
  }
  .ring-wrap svg {
    width: 120px;
    height: 120px;
    transform: rotate(-90deg);
  }
  .ring-track {
    fill: none;
    stroke: #f0f0f0;
    stroke-width: 8;
  }
  .ring-fill {
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 314.16;
    stroke-dashoffset: 314.16;
    transition: stroke-dashoffset 0.45s cubic-bezier(.4,0,.2,1), stroke 0.3s;
  }
  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .ring-pct {
    font-size: 26px;
    font-weight: 400;
    color: #1a1a1a;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .ring-sub {
    font-size: 12px;
    color: #aaa;
    margin-top: 2px;
  }

  /* Right summary */
  .summary { flex: 1; padding-top: 4px; }
  .checklist-title {
    font-size: 22px;
    font-weight: 500;
    color: #1a1a1a;
    border: none;
    outline: none;
    background: transparent;
    width: 100%;
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }
  .checklist-title::placeholder { color: #ccc; }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .task-count {
    font-size: 14px;
    color: #aaa;
    font-weight: 400;
  }

  /* Color swatches */
  .color-strip { display: flex; align-items: center; gap: 6px; }
  .swatch {
    width: 16px; height: 16px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
    flex-shrink: 0;
    outline: none;
    background: none;
    padding: 0;
  }
  .swatch:hover { transform: scale(1.18); }
  .swatch.active { border-color: #1a1a1a; }
  .custom-swatch-wrap { position: relative; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  .custom-swatch-wrap input[type="color"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; padding: 0; }
  .custom-plus { font-size: 16px; color: #bbb; line-height: 1; pointer-events: none; }

  /* Divider */
  .divider { height: 1px; background: #f2f2f2; margin-bottom: 20px; }

  /* Checklist */
  .checklist { display: flex; flex-direction: column; }
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #f5f5f5;
    transition: opacity 0.2s;
  }
  .item:last-child { border-bottom: none; }
  .item.done { opacity: 0.4; }

  /* Custom checkbox */
  .cb-wrap {
    width: 20px; height: 20px;
    border: 1.5px solid #ddd;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .cb-wrap.checked { border-color: var(--accent, #7F77DD); background: var(--accent, #7F77DD); }
  .cb-wrap svg { display: none; }
  .cb-wrap.checked svg { display: block; }

  .item-label {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    color: #1a1a1a;
    border: none;
    outline: none;
    background: transparent;
    letter-spacing: -0.1px;
  }
  .item.done .item-label { text-decoration: line-through; color: #bbb; }
  .del-btn {
    background: none; border: none; cursor: pointer;
    color: #ddd; font-size: 18px; line-height: 1;
    padding: 2px 4px; border-radius: 4px;
    opacity: 0; transition: opacity 0.15s, color 0.15s;
  }
  .item:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: #aaa; }

  /* Add row */
  .add-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 18px;
  }
  .add-input {
    flex: 1;
    font-size: 15px;
    color: #1a1a1a;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-weight: 400;
  }
  .add-input::placeholder { color: #ccc; }
  .add-btn {
    font-size: 15px;
    color: #1a1a1a;
    font-weight: 500;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 4px 0;
    letter-spacing: -0.1px;
  }
  .add-btn:hover { color: #555; }

  /* Done banner */
  .done-banner {
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    margin-top: 16px;
    display: none;
    transition: background 0.3s, color 0.3s;
  }
</style>

<div style="max-width:700px;">
  <div class="top">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-track" cx="60" cy="60" r="50"/>
        <circle class="ring-fill" id="ring" cx="60" cy="60" r="50"/>
      </svg>
      <div class="ring-label">
        <span class="ring-pct" id="pct">0%</span>
        <span class="ring-sub">done</span>
      </div>
    </div>

    <div class="summary">
      <input class="checklist-title" id="list-title" value="Core Infrastructure" placeholder="Checklist title"/>
      <div class="meta-row">
        <span class="task-count" id="count">0 of 0 tasks complete</span>
        <div class="color-strip" id="swatches"></div>
      </div>
    </div>
  </div>

  <div class="divider"></div>
  <div class="checklist" id="list"></div>
  <div class="done-banner" id="banner">All done!</div>

  <div class="add-row">
    <input class="add-input" id="new-item" placeholder="Add a task and press Enter…"/>
    <button class="add-btn" onclick="addItem()">+ Add</button>
  </div>
</div>

<script>
  const CIRC = 2 * Math.PI * 50; // 314.16
  const PRESETS = ['#7F77DD','#1D9E75','#D85A30','#378ADD','#D4537E','#E24B4A','#BA7517','#639922'];
  let color = '#7F77DD';
  let items = [
    { id:1, text:'Embedding Model', done:false },
    { id:2, text:'Identify Data Sources', done:false },
    { id:3, text:'Data Retrieval', done:false },
    { id:4, text:'Agents', done:false },
  ];
  let nextId = 5;

  function hexToRgba(hex, a) {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function applyColor(c, fromCustom) {
    color = c;
    document.documentElement.style.setProperty('--accent', c);
    document.getElementById('ring').style.stroke = c;
    if (!fromCustom) document.getElementById('custom-color').value = c;
    const banner = document.getElementById('banner');
    banner.style.background = hexToRgba(c, 0.08);
    banner.style.color = c;
    document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.color === c));
    const dot = document.getElementById('custom-dot');
    if (dot) dot.style.color = fromCustom ? c : '#bbb';
    // update checked boxes
    document.querySelectorAll('.cb-wrap.checked').forEach(cb => cb.style.setProperty('--accent', c));
    render();
  }

  function buildSwatches() {
    const wrap = document.getElementById('swatches');
    PRESETS.forEach(hex => {
      const btn = document.createElement('button');
      btn.className = 'swatch' + (hex === color ? ' active' : '');
      btn.style.background = hex;
      btn.dataset.color = hex;
      btn.title = hex;
      btn.setAttribute('aria-label', 'Color ' + hex);
      btn.onclick = () => applyColor(hex, false);
      wrap.appendChild(btn);
    });
    const cw = document.createElement('div');
    cw.className = 'custom-swatch-wrap';
    const plus = document.createElement('span');
    plus.className = 'custom-plus';
    plus.id = 'custom-dot';
    plus.textContent = '+';
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.id = 'custom-color';
    inp.value = color;
    inp.setAttribute('aria-label', 'Custom color');
    inp.addEventListener('input', e => applyColor(e.target.value, true));
    cw.appendChild(plus);
    cw.appendChild(inp);
    wrap.appendChild(cw);
  }

  function render() {
    const total = items.length;
    const done = items.filter(i => i.done).length;
    const pct = total ? Math.round(done / total * 100) : 0;

    document.getElementById('pct').textContent = pct + '%';
    document.getElementById('ring').style.strokeDashoffset = CIRC * (1 - pct / 100);
    document.getElementById('count').textContent = done + ' of ' + total + ' task' + (total===1?'':'s') + ' complete';
    const banner = document.getElementById('banner');
    banner.style.display = (total > 0 && done === total) ? 'block' : 'none';

    const list = document.getElementById('list');
    list.innerHTML = '';
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item' + (item.done ? ' done' : '');

      const cb = document.createElement('div');
      cb.className = 'cb-wrap' + (item.done ? ' checked' : '');
      cb.style.setProperty('--accent', color);
      cb.style.background = item.done ? color : '';
      cb.style.borderColor = item.done ? color : '';
      cb.innerHTML = `<svg width="10" height="8" viewBox="0 0 10 8" fill="none">
        <path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
      cb.onclick = () => toggle(item.id);

      const label = document.createElement('input');
      label.className = 'item-label';
      label.value = item.text;
      label.readOnly = item.done;
      label.onchange = e => rename(item.id, e.target.value);

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Delete');
      del.onclick = () => remove(item.id);

      row.appendChild(cb);
      row.appendChild(label);
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  function toggle(id) { const i=items.find(x=>x.id===id); if(i) i.done=!i.done; render(); }
  function rename(id, val) { const i=items.find(x=>x.id===id); if(i) i.text=val; }
  function remove(id) { items=items.filter(x=>x.id!==id); render(); }
  function addItem() {
    const inp = document.getElementById('new-item');
    const text = inp.value.trim();
    if (!text) return;
    items.push({ id: nextId++, text, done: false });
    inp.value = '';
    render();
  }

  document.getElementById('new-item').addEventListener('keydown', e => { if(e.key==='Enter') addItem(); });
  buildSwatches();
  applyColor(color, false);
  render();
</script>

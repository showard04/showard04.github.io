
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .wrap { padding: 2rem 1rem; max-width: 600px; margin: 0 auto; font-family: var(--font-sans); }
  .top { display: flex; align-items: center; gap: 2rem; margin-bottom: 1.25rem; }
  .circle-wrap { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
  svg.ring { width: 140px; height: 140px; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--color-border-tertiary); stroke-width: 10; }
  .progress { fill: none; stroke-width: 10; stroke-linecap: round;
    transition: stroke-dashoffset 0.4s cubic-bezier(.4,0,.2,1), stroke 0.3s; }
  .pct-label { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .pct-num { font-size: 28px; font-weight: 500; color: var(--color-text-primary); line-height: 1; }
  .pct-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
  .summary { flex: 1; }
  .title-input { font-size: 18px; font-weight: 500; color: var(--color-text-primary);
    border: none; background: transparent; width: 100%; outline: none;
    border-bottom: 1px solid var(--color-border-tertiary); padding-bottom: 4px; margin-bottom: 8px; }
  .progress-bar-wrap { height: 6px; background: var(--color-border-tertiary);
    border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
  .progress-bar-fill { height: 100%; border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1), background 0.3s; }
  .meta-row { display: flex; align-items: center; justify-content: space-between; }
  .count { font-size: 13px; color: var(--color-text-secondary); }

  .color-strip { display: flex; align-items: center; gap: 5px; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; cursor: pointer;
    border: 1.5px solid transparent; transition: transform 0.15s, border-color 0.15s; flex-shrink: 0; }
  .swatch:hover { transform: scale(1.2); }
  .swatch.active { border-color: var(--color-text-primary); }
  .custom-swatch { position: relative; width: 14px; height: 14px; }
  .custom-swatch input[type="color"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; padding: 0; }
  .custom-swatch-dot { width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px dashed var(--color-border-secondary); display: flex; align-items: center;
    justify-content: center; font-size: 10px; color: var(--color-text-tertiary); pointer-events: none; }

  .checklist { display: flex; flex-direction: column; gap: 6px; margin-top: 1.25rem; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--color-background-secondary); border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-tertiary); transition: opacity 0.2s; }
  .item.done { opacity: 0.55; }
  .item-label { flex: 1; font-size: 15px; color: var(--color-text-primary);
    border: none; background: transparent; outline: none; }
  .item.done .item-label { text-decoration: line-through; color: var(--color-text-secondary); }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--color-text-tertiary);
    font-size: 18px; padding: 2px 4px; border-radius: 4px; line-height: 1; opacity: 0; transition: opacity 0.15s; }
  .item:hover .del-btn { opacity: 1; }
  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-input { flex: 1; font-size: 14px; padding: 8px 12px;
    border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md);
    background: var(--color-background-primary); color: var(--color-text-primary); outline: none; }
  .add-btn { padding: 8px 16px; border-radius: var(--border-radius-md);
    background: var(--color-background-secondary); border: 0.5px solid var(--color-border-secondary);
    color: var(--color-text-primary); font-size: 14px; cursor: pointer; white-space: nowrap; }
  .add-btn:hover { background: var(--color-background-tertiary); }
  .add-btn:active { transform: scale(0.98); }
  .done-banner { text-align: center; padding: 10px; border-radius: var(--border-radius-md);
    font-size: 13px; font-weight: 500; margin-top: 10px; display: none; transition: background 0.3s, color 0.3s; }
</style>

<div class="wrap">
  <div class="top">
    <div class="circle-wrap">
      <svg class="ring" viewBox="0 0 140 140">
        <circle class="track" cx="70" cy="70" r="56"/>
        <circle class="progress" id="ring" cx="70" cy="70" r="56"
          stroke-dasharray="351.86" stroke-dashoffset="351.86"/>
      </svg>
      <div class="pct-label">
        <span class="pct-num" id="pct">0%</span>
        <span class="pct-sub">done</span>
      </div>
    </div>
    <div class="summary">
      <input class="title-input" id="list-title" value="My checklist" placeholder="Checklist title" />
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar" style="width:0%"></div></div>
      <div class="meta-row">
        <span class="count" id="count">0 of 0 tasks complete</span>
        <div class="color-strip" id="swatches"></div>
      </div>
    </div>
  </div>

  <div class="checklist" id="list"></div>
  <div class="done-banner" id="banner">All tasks complete!</div>

  <div class="add-row">
    <input class="add-input" id="new-item" placeholder="Add a task and press Enter…" />
    <button class="add-btn" onclick="addItem()">+ Add</button>
  </div>
</div>

<script>
const CIRC = 2 * Math.PI * 56;
const PRESETS = ['#7F77DD','#1D9E75','#D85A30','#378ADD','#D4537E','#E24B4A','#BA7517','#639922'];
let color = '#7F77DD';
let items = [
  { id: 1, text: 'Set up Notion page', done: false },
  { id: 2, text: 'Write project goals', done: false },
  { id: 3, text: 'Invite team members', done: false },
  { id: 4, text: 'Add first tasks', done: false },
];
let nextId = 5;

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function applyColor(c, fromCustom) {
  color = c;
  document.getElementById('ring').style.stroke = c;
  document.getElementById('bar').style.background = c;
  if (!fromCustom) document.getElementById('custom-color').value = c;
  const banner = document.getElementById('banner');
  banner.style.background = hexToRgba(c, 0.1);
  banner.style.color = c;
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.color === c));
  const dot = document.getElementById('custom-dot');
  if (dot) dot.style.background = fromCustom ? c : '';
}

function buildSwatches() {
  const wrap = document.getElementById('swatches');
  PRESETS.forEach(hex => {
    const s = document.createElement('button');
    s.className = 'swatch' + (hex === color ? ' active' : '');
    s.style.cssText = `background:${hex};`;
    s.dataset.color = hex;
    s.title = hex;
    s.setAttribute('aria-label', 'Color ' + hex);
    s.onclick = () => { applyColor(hex, false); render(); };
    wrap.appendChild(s);
  });

  const customWrap = document.createElement('div');
  customWrap.className = 'custom-swatch';
  customWrap.title = 'Custom color';
  const dot = document.createElement('div');
  dot.className = 'custom-swatch-dot';
  dot.id = 'custom-dot';
  dot.textContent = '+';
  const inp = document.createElement('input');
  inp.type = 'color';
  inp.id = 'custom-color';
  inp.value = color;
  inp.setAttribute('aria-label', 'Pick custom color');
  inp.addEventListener('input', e => { applyColor(e.target.value, true); render(); });
  customWrap.appendChild(dot);
  customWrap.appendChild(inp);
  wrap.appendChild(customWrap);
}

function render() {
  const total = items.length;
  const done = items.filter(i => i.done).length;
  const pct = total ? Math.round(done / total * 100) : 0;

  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('ring').style.strokeDashoffset = CIRC * (1 - pct / 100);
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('count').textContent = done + ' of ' + total + ' task' + (total === 1 ? '' : 's') + ' complete';
  const banner = document.getElementById('banner');
  banner.style.display = (total > 0 && done === total) ? 'block' : 'none';

  const list = document.getElementById('list');
  list.innerHTML = '';
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item' + (item.done ? ' done' : '');
    row.innerHTML = `
      <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggle(${item.id})" aria-label="Mark complete" style="accent-color:${color};width:18px;height:18px;cursor:pointer;flex-shrink:0;">
      <input class="item-label" value="${item.text.replace(/"/g,'&quot;')}" onchange="rename(${item.id}, this.value)" ${item.done ? 'readonly' : ''}>
      <button class="del-btn" onclick="remove(${item.id})" aria-label="Delete task">×</button>
    `;
    list.appendChild(row);
  });
}

function toggle(id) { const i = items.find(x=>x.id===id); if(i) i.done=!i.done; render(); }
function rename(id, val) { const i = items.find(x=>x.id===id); if(i) i.text=val; }
function remove(id) { items = items.filter(x=>x.id!==id); render(); }
function addItem() {
  const inp = document.getElementById('new-item');
  const text = inp.value.trim();
  if (!text) return;
  items.push({ id: nextId++, text, done: false });
  inp.value = '';
  render();
}

document.getElementById('new-item').addEventListener('keydown', e => { if(e.key==='Enter') addItem(); });

buildSwatches();
applyColor(color, false);
render();
</script>
